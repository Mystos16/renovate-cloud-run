name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - generate-token.js
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests (including forks) only validate the build. No secrets, no push.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false

  # Publishing runs only from main and only inside the "dockerhub" environment,
  # which holds the Docker Hub token and is restricted to the main branch.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/renovate-gcp-runner:${{ github.run_number }}
            ${{ vars.DOCKERHUB_USERNAME }}/renovate-gcp-runner:latest

      - name: Print image reference to pin in Cloud Run
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/renovate-gcp-runner
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "docker.io/${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
